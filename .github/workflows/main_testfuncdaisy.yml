name: Build and deploy Python project to Azure Function App - Testfuncdaisy

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python version
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create deployment package (zip)
        run: |
          mkdir build
          cp -r FlaskApp requirements.txt host.json build/
          cd build
          zip -r ../functionapp.zip .
          cd ..

      - name: Deploy to Azure Function App
        uses: Azure/functions-action@v1
        with:
          app-name: 'Testfuncdaisy'
          slot-name: 'Production'
          package: functionapp.zip
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_7CB7750F488E4D73B0ADD0AF2A4F7388 }}
